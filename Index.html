:root{
  --bg:#04090c;
  --surface:#081219;
  --surface-2:#0b1b24;
  --surface-3:#10242f;
  --line:rgba(0,229,255,.18);
  --text:#eafcff;
  --muted:#9db8c2;
  --cyan:#00e5ff;
  --cyan-2:#00b8d4;
  --gold:#ffd166;
  --red:#ff4d6d;
  --green:#2ee66b;
  --safe-area-inset-top:0px;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#04090c;
    --surface:#081219;
    --text:#eafcff;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Cairo',system-ui,Tahoma,sans-serif;
  overflow-x:clip
}

.font-display{
  font-family:'Changa','Cairo',sans-serif
}

.text-glow{
  text-shadow:0 0 28px rgba(0,229,255,.55)
}

.card{
  background:linear-gradient(145deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);
  border-radius:22px
}

.chip{
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 12px;
  font-size:13px;
  color:#c9f7ff;
  background:rgba(0,229,255,.07)
}

.btn-cyan{
  background:linear-gradient(135deg,#00e5ff,#00a8ff);
  color:#02141a;
  font-weight:900;
  box-shadow:0 10px 28px rgba(0,229,255,.28)
}

.btn-cyan:hover{
  filter:brightness(1.08);
  transform:translateY(-1px)
}

.btn-ghost{
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.04)
}

.input{
  width:100%;
  background:#061117;
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px;
  padding:13px 15px;
  color:var(--text);
  outline:none;
  font-family:inherit
}

.input:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(0,229,255,.18)
}

.input::-moz-placeholder{
  color:#6d8a94
}

.input::placeholder{
  color:#6d8a94
}

label{
  font-weight:800;
  font-size:14px;
  display:block;
  margin-bottom:7px
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-8px)
  }
}

@keyframes pulseDot{
  0%,100%{
    opacity:1;
    transform:scale(1)
  }

  50%{
    opacity:.45;
    transform:scale(.78)
  }
}

@keyframes marquee{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(50%)
  }
}

.animate-floaty{
  animation:floaty 3.4s ease-in-out infinite
}

.live-dot{
  width:9px;
  height:9px;
  border-radius:999px;
  background:#2ee66b;
  box-shadow:0 0 0 5px rgba(46,230,107,.18);
  animation:pulseDot 1.5s infinite
}

.marquee{
  animation:marquee 22s linear infinite;
  white-space:nowrap
}

.video-card{
  aspect-ratio:9/16;
  position:relative;
  overflow:hidden;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.16)
}

.signal-bar{
  height:9px;
  border-radius:999px;
  background:#122b35;
  overflow:hidden
}

.signal-fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#00b8d4,#00e5ff,#a5f3ff);
  transition:width .55s ease
}

::-webkit-scrollbar{
  width:9px
}

::-webkit-scrollbar-thumb{
  background:#174254;
  border-radius:99px
}

  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
